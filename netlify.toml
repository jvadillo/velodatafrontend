[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

# When moving the domain to Netlify, first point velodata-api.jonvadillo.com
# at the VPS and enable its Caddy site. Proxy keeps cookies first-party.
[[redirects]]
from = "/api/*"
to = "https://velodata-api.jonvadillo.com/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
X-Frame-Options = "DENY"
